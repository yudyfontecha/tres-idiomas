<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba del motor</title>
<style>
  body{margin:0;background:#E9EDE4;color:#19211C;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:21px;margin:0 0 4px}
  p.lead{margin:0 0 20px;color:#5A6A5E;font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
  input{width:100%;padding:12px 14px;font-size:16px;border:1px solid #CFD7C6;border-radius:12px;background:#F6F8F2;color:#19211C}
  button.main{margin-top:16px;width:100%;padding:14px;font-size:16px;font-weight:700;border:0;border-radius:12px;background:#19211C;color:#F6F8F2;cursor:pointer}
  button.main:disabled{opacity:.5;cursor:default}
  .out{margin-top:22px}
  .row{background:#F6F8F2;border:1px solid #CFD7C6;border-left:6px solid var(--c);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
  .row .body{flex:1;min-width:0}
  .row .n{font-size:11.5px;font-weight:700;color:var(--c)}
  .row .t{font-size:20px;font-weight:600;word-wrap:break-word}
  .spk{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:1px solid #CFD7C6;background:#E9EDE4;color:var(--c);font-size:19px;cursor:pointer}
  .spk:disabled{opacity:.45;cursor:default}
  .err{background:#FBEDEF;border:1px solid #E0B6C0;border-radius:12px;padding:12px 14px;font-size:13px;white-space:pre-wrap;word-wrap:break-word;margin-top:12px}
  .ok{background:#E7F0E9;border:1px solid #A9C6B2;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px}
  .hint{font-size:12.5px;color:#5A6A5E;margin-top:10px}
  .status{font-size:13px;color:#5A6A5E;margin-top:10px;min-height:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Prueba del motor</h1>
  <p class="lead">Esto no es la app. Comprueba dos cosas: si Gemini traduce bien y si sabe hablar los tres idiomas.</p>

  <label for="key">Pega aquí tu clave</label>
  <input id="key" type="password" placeholder="La clave que guardaste" autocomplete="off" spellcheck="false">
  <div class="hint">Se queda solo en este navegador.</div>

  <label for="frase">Frase en español</label>
  <input id="frase" type="text" value="hola, buenos días" autocomplete="off">

  <button class="main" id="go">Traducir</button>

  <div class="status" id="status"></div>
  <div class="out" id="out"></div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var BASE = "https://generativelanguage.googleapis.com/v1beta/models/";
  var TEXT_MODEL = "gemini-3.6-flash";
  // se prueban en orden hasta que uno responda
  var TTS_MODELS = ["gemini-3.8-flash-tts","gemini-3.1-flash-tts","gemini-3.1-flash-tts-preview","gemini-2.5-flash-preview-tts"];
  var ttsModelOk = null;

  var LANGS = [
    { k:"en", label:"Inglés",     c:"#8C1D3F", say:"English" },
    { k:"no", label:"Noruego",    c:"#14524A", say:"Norwegian Bokmål" },
    { k:"nl", label:"Neerlandés", c:"#9A5B08", say:"Dutch" }
  ];

  try{ var s = localStorage.getItem("prueba-key"); if(s) $("key").value = s; }catch(e){}

  function setStatus(t){ $("status").textContent = t || ""; }
  function errBox(msg){ var d=document.createElement("div"); d.className="err"; d.textContent=msg; return d; }

  function call(model, body, key){
    return fetch(BASE + model + ":generateContent", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-goog-api-key": key },
      body: JSON.stringify(body)
    }).then(function(r){
      return r.text().then(function(txt){ return { ok:r.ok, status:r.status, txt:txt }; });
    });
  }

  /* ---- PCM crudo a WAV reproducible ---- */
  function pcmToWav(b64, rate){
    var bin = atob(b64);
    var n = bin.length;
    var pcm = new Uint8Array(n);
    for(var i=0;i<n;i++) pcm[i] = bin.charCodeAt(i);
    var buf = new ArrayBuffer(44 + n);
    var v = new DataView(buf);
    function str(off, s){ for(var j=0;j<s.length;j++) v.setUint8(off+j, s.charCodeAt(j)); }
    str(0,"RIFF");  v.setUint32(4, 36+n, true);   str(8,"WAVE");
    str(12,"fmt "); v.setUint32(16,16,true);      v.setUint16(20,1,true);
    v.setUint16(22,1,true);                        v.setUint32(24,rate,true);
    v.setUint32(28,rate*2,true);                   v.setUint16(32,2,true);
    v.setUint16(34,16,true);                       str(36,"data");
    v.setUint32(40,n,true);
    new Uint8Array(buf,44).set(pcm);
    return new Blob([buf], { type:"audio/wav" });
  }

  function speak(text, L, btn){
    var key = $("key").value.trim();
    if(!key) return;
    btn.disabled = true;
    setStatus("Pidiendo la voz en " + L.label.toLowerCase() + "…");

    var body = {
      contents: [ { parts: [ { text: "Read the following aloud in " + L.say + ", naturally: " + text } ] } ],
      generationConfig: {
        responseModalities: ["AUDIO"],
        speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } }
      }
    };

    var order = ttsModelOk ? [ttsModelOk] : TTS_MODELS.slice();
    var i = 0, lastErr = "";

    function attempt(){
      if(i >= order.length){
        btn.disabled = false;
        setStatus("");
        $("out").appendChild(errBox("No se pudo obtener la voz.\n\n" + lastErr.slice(0,600)));
        return;
      }
      var model = order[i++];
      call(model, body, key).then(function(res){
        if(!res.ok){ lastErr = model + " → " + res.status + ": " + res.txt; attempt(); return; }
        var data;
        try{ data = JSON.parse(res.txt); }catch(e){ lastErr = "respuesta ilegible"; attempt(); return; }
        var inl = null, mime = "";
        try{
          var parts = data.candidates[0].content.parts;
          for(var p=0;p<parts.length;p++){
            if(parts[p].inlineData && parts[p].inlineData.data){ inl = parts[p].inlineData.data; mime = parts[p].inlineData.mimeType || ""; break; }
          }
        }catch(e){}
        if(!inl){ lastErr = model + " → no devolvió audio: " + res.txt.slice(0,400); attempt(); return; }

        ttsModelOk = model;
        var rate = 24000;
        var m = /rate=(\d+)/.exec(mime);
        if(m) rate = parseInt(m[1],10);
        var blob = (/wav/i.test(mime)) ? new Blob([Uint8Array.from(atob(inl), function(c){ return c.charCodeAt(0); })], {type:"audio/wav"}) : pcmToWav(inl, rate);
        var url = URL.createObjectURL(blob);
        var a = new Audio(url);
        a.onended = function(){ btn.disabled = false; setStatus("Voz obtenida con el modelo " + model); };
        a.onerror = function(){ btn.disabled = false; setStatus("El audio llegó pero el navegador no lo reprodujo."); };
        a.play().catch(function(){ btn.disabled = false; setStatus("El navegador bloqueó la reproducción. Toca otra vez."); });
      }).catch(function(e){
        lastErr = (e && e.message) ? e.message : "fallo de red";
        attempt();
      });
    }
    attempt();
  }

  $("go").addEventListener("click", function(){
    var key = $("key").value.trim();
    var frase = $("frase").value.trim();
    $("out").textContent = "";
    if(!key){ $("out").appendChild(errBox("Falta la clave.")); return; }
    if(!frase){ $("out").appendChild(errBox("Falta la frase.")); return; }
    try{ localStorage.setItem("prueba-key", key); }catch(e){}

    $("go").disabled = true;
    setStatus("Traduciendo…");

    var prompt =
      "Traduce la siguiente frase del español al inglés, al noruego bokmål y al neerlandés.\n" +
      "Responde ÚNICAMENTE con un objeto JSON, sin explicaciones y sin marcas de código.\n" +
      'Formato exacto: {"en":"...","no":"...","nl":"..."}\n\nFrase: ' + frase;

    call(TEXT_MODEL, { contents:[ { parts:[ { text: prompt } ] } ] }, key).then(function(res){
      $("go").disabled = false;
      setStatus("");
      if(!res.ok){ $("out").appendChild(errBox("Google respondió con error " + res.status + ":\n\n" + res.txt.slice(0,600))); return; }
      var data;
      try{ data = JSON.parse(res.txt); }catch(e){ $("out").appendChild(errBox("Respuesta ilegible:\n\n"+res.txt.slice(0,600))); return; }
      var out = "";
      try{
        var parts = data.candidates[0].content.parts;
        for(var i=0;i<parts.length;i++){ if(parts[i].text) out += parts[i].text; }
      }catch(e){}
      if(!out){ $("out").appendChild(errBox("No devolvió texto:\n\n"+res.txt.slice(0,600))); return; }
      var clean = out.replace(/```json/gi,"").replace(/```/g,"").trim();
      var tr;
      try{ tr = JSON.parse(clean); }catch(e){ $("out").appendChild(errBox("No contestó en el formato pedido:\n\n"+clean.slice(0,600))); return; }

      LANGS.forEach(function(L){
        var texto = tr[L.k] ? String(tr[L.k]) : "";
        var row = document.createElement("div");
        row.className = "row";
        row.style.setProperty("--c", L.c);
        var body = document.createElement("div");
        body.className = "body";
        var n = document.createElement("div"); n.className="n"; n.textContent = L.label;
        var t = document.createElement("div"); t.className="t"; t.textContent = texto || "(vacío)";
        body.appendChild(n); body.appendChild(t);
        var b = document.createElement("button");
        b.className = "spk";
        b.textContent = "▶";
        b.setAttribute("aria-label","Escuchar en "+L.label.toLowerCase());
        b.disabled = !texto;
        b.addEventListener("click", function(){ speak(texto, L, b); });
        row.appendChild(body); row.appendChild(b);
        $("out").appendChild(row);
      });

      var ok = document.createElement("div");
      ok.className = "ok";
      ok.textContent = "Tradujo. Ahora toca el botón ▶ de cada idioma para oírlo, empezando por el noruego.";
      $("out").appendChild(ok);
    }).catch(function(e){
      $("go").disabled = false;
      setStatus("");
      $("out").appendChild(errBox("No se pudo conectar.\n\n" + (e && e.message ? e.message : "")));
    });
  });
})();
</script>
</body>
</html>
